<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Thermal path across an advanced package</title><desc id="desc">A conceptual cross-section showing two chiplets, an interposer, a substrate and heat spreading paths. Not measured data.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L8 4.5 1 8" fill="none" stroke="#e66564" stroke-width="1.8"/></marker></defs><rect width="960" height="500" fill="#102e43"/><text x="42" y="57" fill="#fff" font-size="26" font-family="Arial,sans-serif" font-weight="700">Thermal path in a package</text><text x="42" y="88" fill="#b9d4e0" font-size="17" font-family="Arial,sans-serif">From chiplet to substrate · conceptual cross-section</text><g font-family="Arial,sans-serif" font-size="18" font-weight="600"><rect x="145" y="120" width="670" height="31" fill="#79b8ca"/><text x="690" y="141" fill="#102e43">Heat spreader</text><rect x="225" y="177" width="190" height="89" fill="#e66564"/><rect x="545" y="177" width="190" height="89" fill="#d7a376"/><text x="265" y="229" fill="#102e43">Chiplet A</text><text x="585" y="229" fill="#102e43">Chiplet B</text><rect x="190" y="287" width="580" height="28" fill="#f5f7f7"/><text x="410" y="307" fill="#102e43">Interposer</text><rect x="105" y="342" width="750" height="63" fill="#3a6c98"/><text x="410" y="381" fill="#fff">Substrate</text></g><g fill="#d7a376"><circle cx="267" cy="329" r="6"/><circle cx="320" cy="329" r="6"/><circle cx="373" cy="329" r="6"/><circle cx="587" cy="329" r="6"/><circle cx="640" cy="329" r="6"/><circle cx="693" cy="329" r="6"/></g><g stroke="#e66564" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M280 270V330"/><path d="M360 269V161"/><path d="M600 270V330"/><path d="M680 269V161"/></g><g font-family="Arial,sans-serif" font-size="17" fill="#e0edf2"><text x="145" y="459">Heat generation</text><circle cx="123" cy="452" r="8" fill="#e66564"/><text x="590" y="459">Heat spreading path</text><path d="M565 453h-34" stroke="#e66564" stroke-width="4" marker-end="url(#arrow)"/></g></svg>